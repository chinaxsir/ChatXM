name: EAS Build
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
      - name: Install dependencies
        run: npm install
      - name: Build Android
        run: eas build --platform android --profile production --non-interactive
      - name: Build iOS (TrollStore/AdHoc)
        run: eas build --platform ios --profile trollstore --non-interactive
