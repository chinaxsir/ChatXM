name: Build APK & TrollStore IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

# 同一分支新推送时自动取消旧构建，避免排队浪费时间
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # 缓存 Gradle 依赖与 Wrapper，二次构建提速明显
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache --parallel
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatXM-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: List ios directory
        run: |
          echo "=== ios directory contents ==="
          ls -la ios/
          echo "=== Looking for .xcworkspace and .xcodeproj ==="
          find ios -name "*.xcworkspace" -o -name "*.xcodeproj" || true
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
      - name: Build unsigned .app (TrollStore compatible)
        run: |
          cd ios
          # 自动查找 workspace 或 project 文件
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -1)
          echo "=== Found workspace: $WORKSPACE ==="
          echo "=== Found project: $PROJECT ==="
          if [ -n "$WORKSPACE" ]; then
            BUILD_CMD="xcodebuild -workspace $WORKSPACE -scheme ChatXM"
          elif [ -n "$PROJECT" ]; then
            SCHEME=$(xcodebuild -list -project "$PROJECT" 2>/dev/null | grep -A20 "Schemes:" | tail -n +2 | head -1 | xargs)
            echo "=== Using scheme: $SCHEME ==="
            BUILD_CMD="xcodebuild -project $PROJECT -scheme ${SCHEME:-ChatXM}"
          else
            echo "ERROR: No .xcworkspace or .xcodeproj found in ios/"
            exit 1
          fi
          set +e
          $BUILD_CMD -configuration Release -sdk iphoneos -arch arm64 -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ONLY_ACTIVE_ARCH=YES > xcodebuild.log 2>&1
          EXIT_CODE=$?
          echo "=== EXIT CODE: $EXIT_CODE ==="
          echo "=== ERRORS (if any) ==="
          grep -i "error:" xcodebuild.log | head -60 || true
          echo "=== LAST 40 LINES ==="
          tail -40 xcodebuild.log
          exit $EXIT_CODE
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -1)
          echo "=== Found app: $APP_PATH ==="
          cp -r "$APP_PATH" Payload/
          zip -qry ChatXM-unsigned.ipa Payload
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatXM-ios-trollstore-ipa
          path: ChatXM-unsigned.ipa

  release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ChatXM Build ${{ github.run_number }}
          body: |
            ## 下载安装
            - **Android**: `ChatXM-android-apk/app-release.apk` → 下载后直接安装
            - **iOS (巨魔 TrollStore)**: `ChatXM-ios-trollstore-ipa/ChatXM-unsigned.ipa` → 下载后用 TrollStore 打开安装（免签名，免开发者账号）
          files: artifacts/**/*
